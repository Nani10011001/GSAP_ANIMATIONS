<!DOCTYPE html>
<html lang          = "en">
<head>
    <meta charset   = "UTF-8">
    <meta name      = "viewport" content="width=device-width, initial-scale=1.0">
    <title>svg animation</title>
</head>
<link rel           = "stylesheet" href="svg.css">
<body>
    <div class      = "str">
        <svg width  = "100%" height="200">
            <path d = "M 10 100 Q 500 100  990 100" stroke="white" fill="transparent"/>
          </svg>
          
          
          <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    <script>
            //var pathid="M 10 90 Q 250 10  490 80"
            var intilpathid   = "M 10 100 Q 500 100  990 100";
            var finalpath     = "M 10 100 Q 500 100  990 100";
            const strdiv      = document.querySelector(".str");
            strdiv.addEventListener("mousemove",function(dets){//dets fectch the data from event click mouseenter
intilpathid                   = `M 10 100 Q ${dets.x} ${dets.y}  900 100`;
console.log(intilpathid)
gsap.to('svg path',{
attr                          : {d:intilpathid},
duration:1.5,
ease: "elastic.out(1,0.2)",
})


            })
            strdiv.addEventListener("mouseleave",function(){
                gsap.to('svg path',{
attr                          : {d:finalpath},//we are targetting the path usin
duration:1.5,
ease: "elastic.out(1,0.2)",
})
            })

            
            
          </script>
</body>

</html>
